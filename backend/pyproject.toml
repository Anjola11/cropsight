[project]
name = "cropsight-backend"
version = "0.1.0"
description = "CropSight backend API for real-time crop and weed detection"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.12",
    "pydantic-settings>=2.5.0",
    "slowapi>=0.1.9",
    "pillow>=10.0.0",
    "ultralytics>=8.3.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
